      oneOf:
        - $ref: "#/components/schemas/OpportunityPursuitHandoffReady"
        - $ref: "#/components/schemas/OpportunityPursuitHandoffCompleted"
      discriminator:
        propertyName: state
    OpportunityPursuitHandoffConfirmation:
      type: object
      additionalProperties: false
      required:
        [
          expectedCandidateVersion,
          expectedSourceReceiptSha256,
          expectedTenderVersion,
          expectedConflictBoundarySha256,
          clientId,
          expectedClientVersion,
          tenderLotId,
          expectedTenderLotVersion,
          confirmedLotReference,
          reviewerUserId,
          officialSourceReopened,
          confirmedBuyer,
          confirmedReference,
          confirmedSubmissionDeadline,
          confirmationNote,
        ]
      allOf:
        - if:
            properties:
              tenderLotId: { type: "null" }
          then:
            properties:
              expectedTenderLotVersion: { type: "null" }
              confirmedLotReference: { type: "null" }
          else:
            properties:
              tenderLotId: { type: string, format: uuid }
              expectedTenderLotVersion: { type: integer, minimum: 1 }
              confirmedLotReference:
                { type: string, minLength: 1, maxLength: 512 }
      properties:
        expectedCandidateVersion: { type: integer, minimum: 1 }
        expectedSourceReceiptSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        expectedTenderVersion: { type: integer, minimum: 1 }
        expectedConflictBoundarySha256:
          { type: string, pattern: "^[a-f0-9]{64}$" }
        clientId: { type: string, format: uuid }
        expectedClientVersion: { type: integer, minimum: 1 }
        tenderLotId: { type: [string, "null"], format: uuid }
        expectedTenderLotVersion: { type: [integer, "null"], minimum: 1 }
        confirmedLotReference:
          { type: [string, "null"], minLength: 1, maxLength: 512 }
        reviewerUserId: { type: string, format: uuid }
        officialSourceReopened: { type: boolean, const: true }
        confirmedBuyer: { type: string, minLength: 1, maxLength: 512 }
        confirmedReference: { type: string, minLength: 1, maxLength: 128 }
        confirmedSubmissionDeadline:
          { type: [string, "null"], format: date-time }
        confirmationNote: { type: string, minLength: 1, maxLength: 1024 }
