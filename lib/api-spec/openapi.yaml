          }
        customerReference:
          type: string
          minLength: 1
          maxLength: 160
          description: Opaque customer token; plaintext customer identity is never returned.
          example: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        scopeSummary:
          type: string
          minLength: 1
          maxLength: 1000
