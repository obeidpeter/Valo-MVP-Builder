  /projects/{id}/client-actions/evidence-requests/{recordId}/slots/{slotId}/upload-leases:
    post:
      tags: [Client Actions]
      operationId: issueClientActionUploadLease
      summary: Issue a purpose-bound direct-to-storage upload lease
      description: >-
        The named current direct recipient requests a 15-minute lease for the
        latest active, acknowledged request-slot intent at the exact record
        version. The 4,096-byte JSON body carries identity metadata only; raw
        file bytes are accepted only by the returned signed object-storage PUT
        URL, never by this API. Issuance is server-disabled by default and
        returns 503 until every platform, provider and tenant activation gate is
        verified; publishing this contract does not activate production use.
        Once activated, the signed window is at most 840 seconds and
        closes before the database lease; bounded post-expiry reconciliation is
        still required and is not a provider-level create-only guarantee. Reuse
        of Idempotency-Key is allowed only for the exact tenant, actor, request,
        slot, intent, version and declared file material. Valo sends no external
        message and exposes no generic client upload portal.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/OperationsRecordIdParam"
        - $ref: "#/components/parameters/ClientSlotIdParam"
        - $ref: "#/components/parameters/ClientActionUploadIdempotencyKey"
      requestBody:
        required: true
        x-valo-request-body-max-bytes: 4096
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientActionUploadLeaseRequest"
      responses:
        "200":
          description: The exact still-open lease was replayed with a freshly bounded signed URL.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientActionUploadLeaseReplayGrant"
        "201":
          description: The governed upload lease was durably issued.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientActionUploadLeaseCreatedGrant"
        "400": { $ref: "#/components/responses/ClientActionUploadBadRequest" }
        "401": { $ref: "#/components/responses/ClientActionUploadUnauthorized" }
        "403": { $ref: "#/components/responses/ClientActionUploadForbidden" }
        "404": { $ref: "#/components/responses/ClientActionUploadNotFound" }
        "409": { $ref: "#/components/responses/ClientActionUploadConflict" }
        "410": { $ref: "#/components/responses/ClientActionUploadExpired" }
        "413": { $ref: "#/components/responses/ClientActionUploadCapacityExceeded" }
        "500": { $ref: "#/components/responses/ClientActionUploadInternalError" }
        "503": { $ref: "#/components/responses/ClientActionUploadUnavailable" }
  /projects/{id}/client-actions/evidence-requests/{recordId}/slots/{slotId}/upload-leases/{leaseId}/finalize:
    post:
      tags: [Client Actions]
      operationId: finalizeClientActionUploadLease
      summary: Inspect and atomically finalize a governed client upload
      description: >-
        Revalidates the current direct recipient, project, request, latest active
        slot intent, exact record version, idempotency identity, lease and expiry
        before downloading the staged object once for exact size, SHA-256, MIME,
        signature and malware inspection. Successful create-only promotion is
        registered atomically as one document and version, attached only to the
        exact slot, and returned as a receipt; extraction is not started. The
        request contains no file bytes, sends no external message and cannot be
        used as a generic upload portal. Rejected or ambiguous storage
        dispositions fail closed and are reconciled by the governed lifecycle.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/OperationsRecordIdParam"
        - $ref: "#/components/parameters/ClientSlotIdParam"
        - $ref: "#/components/parameters/ClientActionUploadLeaseIdParam"
        - $ref: "#/components/parameters/ClientActionUploadIdempotencyKey"
      requestBody:
        required: true
        x-valo-request-body-max-bytes: 4096
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientActionUploadLeaseRequest"
      responses:
        "200":
          description: The exact completed finalization receipt was replayed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientActionUploadFinalizationReplayReceipt"
        "201":
          description: The inspected object, document version and exact slot binding were committed atomically.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientActionUploadFinalizationCreatedReceipt"
        "400": { $ref: "#/components/responses/ClientActionUploadBadRequest" }
        "401": { $ref: "#/components/responses/ClientActionUploadUnauthorized" }
        "403": { $ref: "#/components/responses/ClientActionUploadForbidden" }
        "404": { $ref: "#/components/responses/ClientActionUploadNotFound" }
        "409": { $ref: "#/components/responses/ClientActionUploadConflict" }
        "410": { $ref: "#/components/responses/ClientActionUploadExpired" }
        "413": { $ref: "#/components/responses/ClientActionUploadCapacityExceeded" }
        "422": { $ref: "#/components/responses/ClientActionUploadIntakeRejected" }
        "500": { $ref: "#/components/responses/ClientActionUploadInternalError" }
        "503": { $ref: "#/components/responses/ClientActionUploadUnavailable" }
