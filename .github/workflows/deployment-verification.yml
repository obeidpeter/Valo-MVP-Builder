name: Deployment verification
run-name: Verify ${{ inputs.environment }} deployment ${{ inputs.deployment_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: GitHub Actions run ID that produced the release candidate
        required: true
        type: string
      source_sha:
        description: Full source commit SHA recorded by the release candidate
        required: true
        type: string
      deployment_id:
        description: Immutable provider deployment ID
        required: true
        type: string
      environment:
        description: Protected GitHub environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  actions: read
  contents: read

concurrency:
  group: deployment-verification-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify-deployment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact merged source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "Source SHA must be a full Git object ID" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          node ./scripts/release-provenance.mjs assert-source \
            --expected-source-commit "$SOURCE_SHA" \
            --ancestor-ref origin/main

      - name: Attest selected candidate workflow run
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node ./scripts/release-provenance.mjs attest-github-run \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --expected-repository "$EXPECTED_REPOSITORY" \
            --expected-repository-id "$EXPECTED_REPOSITORY_ID" \
            --expected-workflow-name "Release candidate" \
            --expected-workflow-path ".github/workflows/release-candidate.yml" \
            --expected-source-commit "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/valo-candidate-run-attestation.json"

      - name: Download exact release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: valo-release-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/valo-release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify downloaded release candidate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          node ./scripts/release-provenance.mjs verify-manifest
          --root "$RUNNER_TEMP/valo-release-candidate"
          --manifest release-evidence/release-manifest.json
          --run-attestation "$RUNNER_TEMP/valo-candidate-run-attestation.json"
          --expected-source-commit "$SOURCE_SHA"

      - name: Verify deployed liveness, readiness, and release identity
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          DEPLOYMENT_URL: ${{ vars.VALO_DEPLOYMENT_ORIGIN }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VALO_READINESS_AUTHORIZATION: ${{ secrets.VALO_READINESS_AUTHORIZATION }}
        run: |
          node ./scripts/release-provenance.mjs verify-deployment \
            --root "$RUNNER_TEMP/valo-release-candidate" \
            --manifest release-evidence/release-manifest.json \
            --deployment-id "$DEPLOYMENT_ID" \
            --deployment-url "$DEPLOYMENT_URL" \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --expected-source-commit "$SOURCE_SHA" \
            --run-attestation "$RUNNER_TEMP/valo-candidate-run-attestation.json" \
            --output release-evidence/deployment-record.json

      - name: Upload deployment verification record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: valo-deployment-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/valo-release-candidate/release-evidence/deployment-record.json
          if-no-files-found: error
          retention-days: 90
