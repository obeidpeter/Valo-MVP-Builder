        recordedReceiptSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        resolvedReceiptSha256:
          { type: [string, "null"], pattern: "^[a-f0-9]{64}$" }
        externalDeliveryReceipt: { type: "null" }
    EvidenceRenewalPlan:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organisationId,
          projectId,
          vaultItemId,
          artefactType,
          owner,
          verifier,
          targetDate,
          internalReminder,
          affectedPursuits,
          status,
          version,
          stagedReplacement,
          reviewReasonCode,
          createdByUserId,
          createdAt,
          updatedAt,
          latestReceiptSha256,
          promotionReceiptSha256,
          receipts,
          externalMessageSent,
        ]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        vaultItemId: { type: string, format: uuid }
        artefactType: { type: string, minLength: 1, maxLength: 512 }
        owner:
          $ref: "#/components/schemas/EvidenceRenewalAuthorityAssignment"
        verifier:
          $ref: "#/components/schemas/EvidenceRenewalAuthorityAssignment"
        targetDate: { type: string, format: date }
        internalReminder:
          $ref: "#/components/schemas/EvidenceRenewalInternalReminder"
        affectedPursuits:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: "#/components/schemas/EvidenceRenewalAffectedPursuit"
        status:
          type: string
          enum: [planned, replacement_staged, promoted, rejected]
        version: { type: integer, minimum: 1, maximum: 3 }
        stagedReplacement:
          oneOf:
            - $ref: "#/components/schemas/EvidenceRenewalStagedReplacement"
            - type: "null"
        reviewReasonCode:
          type: [string, "null"]
          enum:
            [
              replacement_verified,
              incorrect_document,
              expiry_unacceptable,
              quality_issue,
              null,
            ]
        createdByUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        latestReceiptSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        promotionReceiptSha256:
          { type: [string, "null"], pattern: "^[a-f0-9]{64}$" }
        receipts:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/EvidenceRenewalReceipt"
        externalMessageSent: { type: boolean, const: false }
    EvidenceRenewalSnapshot:
      type: object
      additionalProperties: false
      required:
        [
          organisationId,
          projectId,
          generatedAt,
          items,
          limit,
          truncated,
          externalMessagingConnected,
          authorityNote,
        ]
      properties:
        organisationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/EvidenceRenewalPlan"
        limit: { type: integer, const: 100 }
        truncated: { type: boolean, const: false }
        externalMessagingConnected: { type: boolean, const: false }
        authorityNote:
          type: string
          const: This register records a receipt-backed internal due reminder and named-human evidence-renewal workflow. It does not send an external message, contact an issuer or client, approve a pursuit, or claim delivery outside Valo.
    EvidenceRenewalAuthority:
      type: object
      additionalProperties: false
      required: [userId, name]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 512 }
    EvidenceRenewalAuthorityList:
      type: object
      additionalProperties: false
      required: [organisationId, owners, verifiers, limit, truncated]
      properties:
        organisationId: { type: string, format: uuid }
        owners:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/EvidenceRenewalAuthority"
        verifiers:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/EvidenceRenewalAuthority"
        limit: { type: integer, const: 100 }
        truncated: { type: boolean, const: false }
    EvidenceRenewalCreateSuccess:
      type: object
      additionalProperties: false
      required: [outcome, plan, replayed, externalMessageSent, authorityNote]
      properties:
        outcome: { type: string, const: created }
        plan:
          $ref: "#/components/schemas/EvidenceRenewalPlan"
        replayed: { type: boolean }
        externalMessageSent: { type: boolean, const: false }
        authorityNote:
          type: string
          const: This register records a receipt-backed internal due reminder and named-human evidence-renewal workflow. It does not send an external message, contact an issuer or client, approve a pursuit, or claim delivery outside Valo.
    EvidenceRenewalUpdateSuccess:
      type: object
      additionalProperties: false
      required: [outcome, plan, replayed, externalMessageSent, authorityNote]
      properties:
        outcome: { type: string, const: updated }
        plan:
          $ref: "#/components/schemas/EvidenceRenewalPlan"
        replayed: { type: boolean }
        externalMessageSent: { type: boolean, const: false }
        authorityNote:
          type: string
          const: This register records a receipt-backed internal due reminder and named-human evidence-renewal workflow. It does not send an external message, contact an issuer or client, approve a pursuit, or claim delivery outside Valo.
    EvidenceRenewalMutationError:
      type: object
      additionalProperties: false
      required: [error, externalMessageSent, authorityNote]
      properties:
        error:
          type: string
          enum:
            [
              not_found,
              version_conflict,
              state_conflict,
              authority_conflict,
              maker_checker_conflict,
              idempotency_conflict,
              evidence_conflict,
              vault_conflict,
              archived,
              capacity_exceeded,
            ]
        externalMessageSent: { type: boolean, const: false }
        authorityNote:
          type: string
          const: This register records a receipt-backed internal due reminder and named-human evidence-renewal workflow. It does not send an external message, contact an issuer or client, approve a pursuit, or claim delivery outside Valo.
    EvidenceRenewalUnavailableError:
      type: object
      additionalProperties: false
      required: [error, externalMessageSent, authorityNote]
      properties:
        error: { type: string, const: Evidence renewal records are unavailable }
        externalMessageSent: { type: boolean, const: false }
        authorityNote:
          type: string
          const: This register records a receipt-backed internal due reminder and named-human evidence-renewal workflow. It does not send an external message, contact an issuer or client, approve a pursuit, or claim delivery outside Valo.
    CommunicationTemplateContext:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, deadlineAt]
          properties:
            kind: { type: string, const: deadline }
            deadlineAt: { type: string, format: date-time }
        - type: object
          additionalProperties: false
          required: [kind, requestId, dueAt]
          properties:
            kind: { type: string, const: evidence_request }
            requestId: { type: string, format: uuid }
            dueAt: { type: [string, "null"], format: date-time }
        - type: object
          additionalProperties: false
          required: [kind, requestId, correctionSequence]
          properties:
            kind: { type: string, const: evidence_correction }
            requestId: { type: string, format: uuid }
            correctionSequence: { type: integer, minimum: 1, maximum: 5 }
        - type: object
          additionalProperties: false
          required: [kind, packageVersionId, manifestSha256]
          properties:
            kind: { type: string, const: released_package }
            packageVersionId: { type: string, format: uuid }
            manifestSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
      discriminator:
        propertyName: kind
    CommunicationTemplateId:
      type: string
      enum:
        [
          deadline_reminder_v1,
          evidence_request_ready_v1,
          evidence_correction_required_v1,
          package_ready_v1,
        ]
    CommunicationRecipientReference:
      type: object
      additionalProperties: false
      required: [userId, name, channel, consentEvidenceSha256]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 512 }
        channel: { type: string, const: email }
        consentEvidenceSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    CommunicationContextReference:
      type: object
      additionalProperties: false
      required: [id, recipientUserId, label, templateId, context]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]*$"
        recipientUserId: { type: [string, "null"], format: uuid }
        label: { type: string, minLength: 1, maxLength: 160 }
        templateId:
          $ref: "#/components/schemas/CommunicationTemplateId"
        context:
          $ref: "#/components/schemas/CommunicationTemplateContext"
    CommunicationReferenceSet:
      type: object
      additionalProperties: false
      required:
        [organisationId, projectId, recipients, contexts, limit, truncated]
      properties:
        organisationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        recipients:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CommunicationRecipientReference"
        contexts:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CommunicationContextReference"
        limit: { type: integer, const: 100 }
        truncated: { type: boolean }
    QueueCommunicationInput:
      type: object
      additionalProperties: false
      required:
        [
          idempotencyKey,
          channel,
          templateId,
          recipientUserId,
          consentEvidenceSha256,
          context,
          deadlineAt,
        ]
      properties:
        idempotencyKey: { type: string, minLength: 1, maxLength: 160 }
        channel: { type: string, enum: [email, whatsapp_business] }
        templateId:
          {
            type: string,
            enum:
              [
                deadline_reminder_v1,
                evidence_request_ready_v1,
                evidence_correction_required_v1,
                package_ready_v1,
              ],
          }
        recipientUserId: { type: string, format: uuid }
        consentEvidenceSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        context:
          $ref: "#/components/schemas/CommunicationTemplateContext"
        deadlineAt: { type: string, format: date-time }
        maxAttempts: { type: integer, minimum: 1, maximum: 5, default: 3 }
    CommunicationAttemptInput:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    CommunicationReconciliationInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, attemptId, receiptReference]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        attemptId: { type: string, format: uuid }
        receiptReference: { type: string, minLength: 1, maxLength: 256 }
    CommunicationAttempt:
      type: object
      additionalProperties: false
      required:
        [
          id,
          attemptNumber,
          provider,
          idempotencyKey,
          status,
          providerMessageId,
          receiptSha256,
          responseCode,
          attemptedAt,
          nextAttemptAt,
        ]
      properties:
        id: { type: string, format: uuid }
        attemptNumber: { type: integer, minimum: 1, maximum: 5 }
        provider: { type: string, minLength: 1, maxLength: 256 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 160 }
        status:
          {
            type: string,
            enum:
              [
                prepared,
                provider_disconnected,
                policy_blocked,
                provider_rejected,
                outcome_unknown,
                accepted_pending_receipt,
                receipt_verified_delivered,
                receipt_verified_failed,
              ],
          }
        providerMessageId: { type: [string, "null"], maxLength: 256 }
        receiptSha256: { type: [string, "null"], pattern: "^[a-f0-9]{64}$" }
        responseCode: { type: [string, "null"], maxLength: 96 }
        attemptedAt: { type: string, format: date-time }
        nextAttemptAt: { type: [string, "null"], format: date-time }
    CommunicationEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          organisationId,
          projectId,
          channel,
          templateId,
          recipientUserId,
          consentEvidenceSha256,
          context,
          status,
          requestedByUserId,
          requestedAt,
          deadlineAt,
          maxAttempts,
          version,
          attempts,
          deliveryAuthority,
          arbitraryBodyAccepted,
          rawRecipientPersisted,
        ]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        channel: { type: string, enum: [email, whatsapp_business] }
        templateId:
          {
            type: string,
            enum:
              [
                deadline_reminder_v1,
                evidence_request_ready_v1,
                evidence_correction_required_v1,
                package_ready_v1,
              ],
          }
        recipientUserId: { type: string, format: uuid }
        consentEvidenceSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        context:
          $ref: "#/components/schemas/CommunicationTemplateContext"
        status:
          {
            type: string,
            enum:
              [
                queued,
                prepared,
                accepted_pending_receipt,
                retry_wait,
                reconciliation_required,
                delivered,
                dead_letter,
              ],
          }
        requestedByUserId: { type: string, format: uuid }
        requestedAt: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time }
        maxAttempts: { type: integer, minimum: 1, maximum: 5 }
        version: { type: integer, minimum: 1 }
        attempts:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/CommunicationAttempt"
        deliveryAuthority:
          { type: string, const: verified_provider_receipt_only }
        arbitraryBodyAccepted: { type: boolean, const: false }
        rawRecipientPersisted: { type: boolean, const: false }
    CommunicationSnapshot:
      type: object
      additionalProperties: false
      required: [organisationId, projectId, events, policy]
      properties:
        organisationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        events:
          type: array
          maxItems: 250
          items:
            $ref: "#/components/schemas/CommunicationEvent"
        policy:
          type: object
          additionalProperties: false
          required:
            [
              approvedTemplatesOnly,
              arbitraryBodyAccepted,
              arbitraryRecipientAccepted,
              deliveryRequiresVerifiedProviderReceipt,
              autonomousDispatch,
              providersConnected,
            ]
          properties:
            approvedTemplatesOnly: { type: boolean, const: true }
            arbitraryBodyAccepted: { type: boolean, const: false }
            arbitraryRecipientAccepted: { type: boolean, const: false }
            deliveryRequiresVerifiedProviderReceipt:
              { type: boolean, const: true }
            autonomousDispatch: { type: boolean, const: false }
            providersConnected: { type: boolean }
