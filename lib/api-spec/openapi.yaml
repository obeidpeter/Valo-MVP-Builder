      type: object
      additionalProperties: false
      required: [schema, draft, expectedTargetVersion, selectedFields, values]
      allOf:
        - if:
            properties:
              selectedFields:
                contains: { const: title }
          then:
            properties:
              values:
                required: [title]
          else:
            properties:
              values:
                not:
                  required: [title]
        - if:
            properties:
              selectedFields:
                contains: { const: note }
          then:
            properties:
              values:
                required: [note]
          else:
            properties:
              values:
                not:
                  required: [note]
        - if:
            properties:
              selectedFields:
                contains: { const: checklist }
          then:
            properties:
              values:
                required: [checklist]
          else:
            properties:
              values:
                not:
                  required: [checklist]
