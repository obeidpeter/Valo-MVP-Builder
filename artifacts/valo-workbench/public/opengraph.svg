<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Valo — tender readiness grounded in evidence</title>
  <desc id="description">A restrained navy Valo brand card with a teal mark and evidence-led tender readiness message.</desc>
  <rect width="1200" height="630" fill="#0D1B2F"/>
  <rect x="72" y="72" width="64" height="64" rx="12" fill="#F7F5F0"/>
