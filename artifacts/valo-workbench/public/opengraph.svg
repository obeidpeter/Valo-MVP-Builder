  <text x="154" y="116" fill="#F7F5F0" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Valo</text>
  <line x1="72" y1="184" x2="1128" y2="184" stroke="#2E4059" stroke-width="2"/>
  <text x="72" y="284" fill="#62C8B5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="2">TENDER READINESS</text>
