              nullable: true
              description: True when retention is confirmed, false when absence is confirmed, and null when a distributed copy acknowledgement/probe left the quarantine-copy disposition unknown.
            cleanupConfirmed:
              type: boolean
              description: False when cleanup of a promoted stable copy could not be confirmed; staging-path cleanup must not override it.
