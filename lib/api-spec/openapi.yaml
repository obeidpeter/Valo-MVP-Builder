      additionalProperties: false
      required:
        [state, source, clients, reviewers, lots, conflictBoundary, authority]
      properties:
        state: { type: string, const: ready }
        source:
          $ref: "#/components/schemas/OpportunityPursuitSourceSnapshot"
        clients:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/OpportunityPursuitClientChoice"
        reviewers:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/OpportunityPursuitReviewerChoice"
