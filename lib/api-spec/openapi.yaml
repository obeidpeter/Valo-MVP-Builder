openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Valo Bid Autopsy Workbench API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Current-user and user administration
  - name: Clients
    description: Client profiles and NDA status
  - name: Projects
    description: Tender/bid autopsy projects
  - name: Dashboard
    description: Dashboard aggregates and Gate 0 metrics
  - name: Documents
    description: Document intake and classification
  - name: Requirements
    description: Requirement matrix
  - name: Evidence
    description: Evidence mapping
  - name: Defects
    description: Defect register
  - name: BOQ
    description: BOQ Lite arithmetic checks
  - name: Risk
    description: Disqualification-risk scoring
  - name: Reports
    description: DOCX report generation and sign-off
  - name: Audit
    description: Audit trail
  - name: Operations
    description: Internal workflow controls, notifications, retention and alerts
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: Get the current authenticated user (JIT provisioned)
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users:
    get:
      operationId: listUsers
      tags: [Auth]
      summary: List internal users (admin only)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [Auth]
      summary: Update a user's role or status (admin only)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
  /clients:
    get:
      operationId: listClients
      tags: [Clients]
      summary: List clients
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [Clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreate"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/BadRequest"
  /clients/{id}:
    get:
      operationId: getClient
      tags: [Clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateClient
      tags: [Clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List projects with dashboard aggregates
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSummary"
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a tender project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
  /projects/{id}:
    get:
      operationId: getProject
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      tags: [Projects]
      summary: Delete a project and its documents (admin only)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
  /workflow/alerts:
    get:
      operationId: getWorkflowAlerts
      tags: [Operations]
      summary: Internal SLA, red-team and Vault expiry alert candidates
      responses:
        "200":
          description: Alert candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowAlerts"
  /projects/{id}/notifications:
    get:
      operationId: listProjectNotifications
      tags: [Operations]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Notification log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationEvent"
    post:
      operationId: createProjectNotification
      tags: [Operations]
      summary: Queue/log a manual notification event
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationCreate"
      responses:
        "201":
          description: Notification event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{id}/retention-requests:
    post:
      operationId: createRetentionRequest
      tags: [Operations]
      summary: Start a deletion/retention workflow for an engagement
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionRequestCreate"
      responses:
        "201":
          description: Retention request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /retention-requests:
    get:
      operationId: listRetentionRequests
      tags: [Operations]
      summary: List deletion/retention workflows
      responses:
        "200":
          description: Retention requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RetentionRequest"
  /retention-requests/{id}/complete:
    post:
      operationId: completeRetentionRequest
      tags: [Operations]
      summary: Complete a retention request and issue a deletion certificate
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Completed retention request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: Stored files could not be purged; certificate withheld
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /config:
    get:
      operationId: getAppConfig
      tags: [Operations]
      summary: Read the global scoring, template, and retention configuration
      responses:
        "200":
          description: Active configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"
    patch:
      operationId: updateAppConfig
      tags: [Operations]
      summary: Update the global configuration (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppConfigUpdate"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
  /clients/{id}/vault-items:
    get:
      operationId: listVaultItems
      tags: [Vault]
      summary: Certificate Vault artefacts for a client, with expiry telemetry
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Vault items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VaultItem"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createVaultItem
      tags: [Vault]
      summary: Register a certificate/compliance artefact for a client
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultItemCreate"
      responses:
        "201":
          description: Created vault item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /vault-items/{id}:
    patch:
      operationId: updateVaultItem
      tags: [Vault]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultItemUpdate"
      responses:
        "200":
          description: Updated vault item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteVaultItem
      tags: [Vault]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /vault/expiring:
    get:
      operationId: getVaultExpiring
      tags: [Vault]
      summary: Cross-client expiry telemetry (renewal radar)
      responses:
        "200":
          description: Items in or approaching their renewal window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultExpiring"
  /clients/{id}/documents:
    get:
      operationId: listClientDocuments
      tags: [Capability]
      summary: Documents across all of a client's projects (evidence pool)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Client document summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientDocumentSummary"
        "404":
          $ref: "#/components/responses/NotFound"
  /clients/{id}/capability-items:
    get:
      operationId: listCapabilityItems
      tags: [Capability]
      summary: Evidence-linked capability claims for a client
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Capability items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapabilityItem"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createCapabilityItem
      tags: [Capability]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapabilityItemCreate"
      responses:
        "201":
          description: Created capability item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /capability-items/{id}:
    patch:
      operationId: updateCapabilityItem
      tags: [Capability]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapabilityItemUpdate"
      responses:
        "200":
          description: Updated capability item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteCapabilityItem
      tags: [Capability]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /sbd-templates:
    get:
      operationId: listSbdTemplates
      tags: [Sbd]
      summary: Standard Bidding Document corpus, all versions
      responses:
        "200":
          description: SBD templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SbdTemplate"
    post:
      operationId: createSbdTemplate
      tags: [Sbd]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SbdTemplateCreate"
      responses:
        "201":
          description: Created SBD template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbdTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
  /sbd-templates/{id}:
    get:
      operationId: getSbdTemplate
      tags: [Sbd]
      summary: One SBD template with its structured annotations
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: SBD template detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbdTemplateDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSbdTemplate
      tags: [Sbd]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SbdTemplateUpdate"
      responses:
        "200":
          description: Updated SBD template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbdTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSbdTemplate
      tags: [Sbd]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /sbd-templates/{id}/versions:
    post:
      operationId: createSbdTemplateVersion
      tags: [Sbd]
      summary: Clone a template as the next draft version (supersedes source if active)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "201":
          description: New draft version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbdTemplate"
        "404":
          $ref: "#/components/responses/NotFound"
  /sbd-templates/{id}/annotations:
    post:
      operationId: createSbdAnnotation
      tags: [Sbd]
      summary: Add an agency-format quirk annotation to a template
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SbdAnnotationCreate"
      responses:
        "201":
          description: Created annotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbdAnnotation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /sbd-annotations/{id}:
    delete:
      operationId: deleteSbdAnnotation
      tags: [Sbd]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /dashboard/metrics:
    get:
      operationId: getDashboardMetrics
      tags: [Dashboard]
      summary: Gate 0 metrics and portfolio aggregates
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetrics"
  /projects/{id}/documents:
    get:
      operationId: listDocuments
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [Documents]
      summary: Register an uploaded document (after object-storage upload)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentCreate"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: NDA not cleared for this client (intake denied and audited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Uploaded object unreadable in storage; no intake hash could be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /documents/{id}:
    get:
      operationId: getDocument
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Document with extracted text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateDocument
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    delete:
      operationId: deleteDocument
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
  /documents/{id}/extract:
    post:
      operationId: extractDocument
      tags: [Documents]
      summary: (Re-)run text extraction for a document, asynchronously
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "202":
          description: Extraction started; poll the document for extractionStatus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{id}/verify:
    post:
      operationId: verifyDocument
      tags: [Documents]
      summary: Re-hash the stored object and compare against the intake SHA-256
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Integrity verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentIntegrity"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /projects/{id}/extract-requirements:
    post:
      operationId: extractRequirements
      tags: [Requirements]
      summary: Run LLM extraction of candidate requirements from tender documents
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractRequest"
      responses:
        "200":
          description: Extraction result (suggested requirements)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /projects/{id}/scorecard:
    get:
      operationId: getProjectScorecard
      tags: [Requirements]
      summary: Gate 0 Technical Scorecard — engine-vs-human diff and mandatory recall
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Scorecard recomputed live from stored requirement records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scorecard"
  /projects/{id}/requirements:
    get:
      operationId: listRequirements
      tags: [Requirements]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Requirements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Requirement"
    post:
      operationId: createRequirement
      tags: [Requirements]
      summary: Manually add a requirement
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementCreate"
      responses:
        "201":
          description: Created requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
  /projects/{id}/requirements/merge:
    post:
      operationId: mergeRequirements
      tags: [Requirements]
      summary: Merge near-duplicate requirements into a single surviving row
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementMerge"
      responses:
        "200":
          description: The surviving requirement after merge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
  /requirements/{id}:
    patch:
      operationId: updateRequirement
      tags: [Requirements]
      summary: Approve, edit, merge, reject, or annotate a requirement
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementUpdate"
      responses:
        "200":
          description: Updated requirement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
    delete:
      operationId: deleteRequirement
      tags: [Requirements]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /projects/{id}/evidence:
    get:
      operationId: listEvidence
      tags: [Evidence]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Evidence items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvidenceItem"
  /projects/{id}/map-evidence:
    post:
      operationId: mapEvidence
      tags: [Evidence]
      summary: Run LLM evidence mapping against confirmed requirements
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Mapping result (suggested evidence items)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceMapResult"
  /evidence:
    post:
      operationId: createEvidence
      tags: [Evidence]
      summary: Manually create an evidence item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceCreate"
      responses:
        "201":
          description: Created evidence item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceItem"
  /evidence/{id}:
    patch:
      operationId: updateEvidence
      tags: [Evidence]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceUpdate"
      responses:
        "200":
          description: Updated evidence item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceItem"
    delete:
      operationId: deleteEvidence
      tags: [Evidence]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /projects/{id}/defects:
    get:
      operationId: listDefects
      tags: [Defects]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Defects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Defect"
  /projects/{id}/suggest-defects:
    post:
      operationId: suggestDefects
      tags: [Defects]
      summary: Run LLM defect suggestions from requirement matrix + evidence
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Suggested defects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefectSuggestResult"
  /defects:
    post:
      operationId: createDefect
      tags: [Defects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefectCreate"
      responses:
        "201":
          description: Created defect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Defect"
  /defects/{id}:
    patch:
      operationId: updateDefect
      tags: [Defects]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefectUpdate"
      responses:
        "200":
          description: Updated defect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Defect"
    delete:
      operationId: deleteDefect
      tags: [Defects]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /projects/{id}/boq-checks:
    get:
      operationId: listBoqChecks
      tags: [BOQ]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: BOQ checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoqCheck"
  /projects/{id}/run-boq-checks:
    post:
      operationId: runBoqChecks
      tags: [BOQ]
      summary: Run deterministic BOQ Lite arithmetic and consistency checks
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoqRunRequest"
      responses:
        "200":
          description: BOQ check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoqRunResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /boq-checks/{id}/to-defect:
    post:
      operationId: boqCheckToDefect
      tags: [BOQ]
      summary: Push a BOQ finding into the defect register
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "201":
          description: Created defect from BOQ finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Defect"
  /projects/{id}/payment-confirmations:
    post:
      operationId: confirmProjectPayment
      tags: [Projects]
      summary: Record one leg of the dual payment confirmation (server-derived identity)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentConfirmationBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /projects/{id}/responsiveness-review:
    post:
      operationId: runResponsivenessReview
      tags: [Projects]
      summary: Run LLM responsiveness review (suggested narrative)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Responsiveness review result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsivenessResult"
  /projects/{id}/risk:
    get:
      operationId: getRisk
      tags: [Risk]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Computed risk assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAssessment"
  /projects/{id}/risk/override:
    post:
      operationId: overrideRisk
      tags: [Risk]
      summary: Named-reviewer override of the computed risk band
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskOverride"
      responses:
        "200":
          description: Updated risk assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAssessment"
    delete:
      operationId: clearRiskOverride
      tags: [Risk]
      summary: Clear a reviewer risk override, reverting to the computed band
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Risk assessment after clearing the override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAssessment"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{id}/reports:
    get:
      operationId: listReports
      tags: [Reports]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
  /projects/{id}/generate-report:
    post:
      operationId: generateReport
      tags: [Reports]
      summary: Generate a new draft DOCX Bid Autopsy Report version
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "201":
          description: Generated report version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
  /reports/{id}/sign-off:
    post:
      operationId: signOffReport
      tags: [Reports]
      summary: Named-reviewer sign-off that unlocks export
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignOffRequest"
      responses:
        "200":
          description: Signed-off report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
  /reports/{id}/download:
    get:
      operationId: downloadReport
      tags: [Reports]
      summary: Download the generated DOCX
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: DOCX binary
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{id}/export:
    get:
      operationId: exportProject
      tags: [Reports]
      summary: Export project data as a ZIP (admin only)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: ZIP archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
  /audit/access-review:
    get:
      operationId: getAccessReview
      tags: [Audit]
      summary: Monthly access review export
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}$"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
      responses:
        "200":
          description: Access review rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessReview"
            text/csv:
              schema:
                type: string
  /projects/{id}/audit:
    get:
      operationId: listAudit
      tags: [Audit]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          $ref: "#/components/responses/BadRequest"
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    User:
      type: object
      required: [id, email, role, status]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string, nullable: true }
        role:
          type: string
          enum: [admin, reviewer, analyst, none]
        status:
          type: string
          enum: [active, disabled]
        lastLoginAt: { type: string, nullable: true }
        createdAt: { type: string }
    UserUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [admin, reviewer, analyst, none]
        status:
          type: string
          enum: [active, disabled]
    Client:
      type: object
      required: [id, name, ndaStatus, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        sector: { type: string, nullable: true }
        segment:
          type: string
          enum: [federal, nipex_ncdmb, donor, other]
          nullable: true
        contactName: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
        ndaStatus:
          type: string
          enum: [pending, signed, not_required, declined]
        notes: { type: string, nullable: true }
        decisionMakerConversations: { type: integer }
        juniorConversations: { type: integer }
        projectCount: { type: integer, nullable: true }
        createdAt: { type: string }
    ClientCreate:
      type: object
      required: [name, ndaStatus]
      properties:
        name: { type: string, minLength: 1 }
        sector: { type: string }
        segment:
          type: string
          enum: [federal, nipex_ncdmb, donor, other]
        contactName: { type: string }
        contactEmail: { type: string }
        ndaStatus:
          type: string
          enum: [pending, signed, not_required, declined]
        notes: { type: string }
        decisionMakerConversations: { type: integer, minimum: 0 }
        juniorConversations: { type: integer, minimum: 0 }
    ClientUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        sector: { type: string }
        segment:
          type: string
          enum: [federal, nipex_ncdmb, donor, other]
        contactName: { type: string }
        contactEmail: { type: string }
        ndaStatus:
          type: string
          enum: [pending, signed, not_required, declined]
        notes: { type: string }
        decisionMakerConversations: { type: integer, minimum: 0 }
        juniorConversations: { type: integer, minimum: 0 }
    ScorecardCounts:
      type: object
      required:
        [engineConfirmed, engineEdited, engineRejected, engineUnreviewed,
         manualVerified, mandatoryEngineVerified, mandatoryVerifiedTotal]
      properties:
        engineConfirmed: { type: integer }
        engineEdited: { type: integer }
        engineRejected: { type: integer }
        engineUnreviewed: { type: integer }
        manualVerified: { type: integer }
        mandatoryEngineVerified: { type: integer }
        mandatoryVerifiedTotal: { type: integer }
        mandatoryRecall: { type: number, nullable: true }
    DocumentScorecard:
      allOf:
        - $ref: "#/components/schemas/ScorecardCounts"
        - type: object
          properties:
            documentId: { type: string, nullable: true }
            documentName: { type: string, nullable: true }
    Scorecard:
      type: object
      required: [totals, perDocument, legacyRows]
      properties:
        totals:
          $ref: "#/components/schemas/ScorecardCounts"
        perDocument:
          type: array
          items:
            $ref: "#/components/schemas/DocumentScorecard"
        legacyRows: { type: integer }

    WorkflowAlerts:
      type: object
      required: [slaBreaches, redTeamDue, vaultExpiring]
      properties:
        slaBreaches:
          type: array
          items:
            type: object
            required: [projectId, tenderTitle, dueAt, breached]
            properties:
              projectId: { type: string }
              tenderTitle: { type: string }
              dueAt: { type: string }
              breached: { type: boolean }
        redTeamDue:
          type: array
          items:
            type: object
            required: [projectId, tenderTitle, dueAt]
            properties:
              projectId: { type: string }
              tenderTitle: { type: string }
              dueAt: { type: string }
        vaultExpiring:
          type: array
          items:
            type: object
            required: [vaultItemId, clientId, artefactType, expiry]
            properties:
              vaultItemId: { type: string }
              clientId: { type: string }
              clientName: { type: string, nullable: true }
              artefactType: { type: string }
              expiry:
                type: object
                required: [band, daysToExpiry]
                properties:
                  band:
                    type: string
                    enum: [expired, critical, warning, upcoming, ok, unknown]
                  daysToExpiry: { type: integer, nullable: true }
    NotificationEvent:
      type: object
      required: [id, channel, template, status, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string, nullable: true }
        clientId: { type: string, nullable: true }
        vaultItemId: { type: string, nullable: true }
        channel:
          type: string
          enum: [manual, email, whatsapp, in_app]
        template: { type: string }
        recipient: { type: string, nullable: true }
        payload: { type: string, nullable: true }
        status:
          type: string
          enum: [queued, sent, archived, failed]
        createdAt: { type: string }
    NotificationCreate:
      type: object
      required: [template]
      properties:
        channel:
          type: string
          enum: [manual, email, whatsapp, in_app]
        template: { type: string, minLength: 1 }
        recipient: { type: string }
        payload: {}
        status:
          type: string
          enum: [queued, sent, archived, failed]
    RetentionRequest:
      type: object
      required: [id, projectId, dueAt, status, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        reason: { type: string, nullable: true }
        dueAt: { type: string }
        completedAt: { type: string, nullable: true }
        certificateText: { type: string, nullable: true }
        status:
          type: string
          enum: [pending, completed, cancelled]
        createdAt: { type: string }
    RetentionRequestCreate:
      type: object
      properties:
        reason: { type: string }
        dueAt: { type: string }
    SeverityWeights:
      type: object
      required: [fatal, likely_fatal, scoring_risk, cosmetic]
      properties:
        fatal: { type: integer, minimum: 0, maximum: 100 }
        likely_fatal: { type: integer, minimum: 0, maximum: 100 }
        scoring_risk: { type: integer, minimum: 0, maximum: 100 }
        cosmetic: { type: integer, minimum: 0, maximum: 100 }
    BandCutoffs:
      type: object
      required: [medium, high, critical]
      properties:
        medium: { type: integer, minimum: 1, maximum: 100 }
        high: { type: integer, minimum: 1, maximum: 100 }
        critical: { type: integer, minimum: 1, maximum: 100 }
    AppConfig:
      type: object
      required:
        [
          severityWeights,
          missingEvidenceWeight,
          bandCutoffs,
          firmName,
          confidentialityLegend,
          retentionDefaultDays,
          updatedAt,
        ]
      properties:
        severityWeights: { $ref: "#/components/schemas/SeverityWeights" }
        missingEvidenceWeight: { type: integer, minimum: 0, maximum: 100 }
        bandCutoffs: { $ref: "#/components/schemas/BandCutoffs" }
        firmName: { type: string }
        confidentialityLegend: { type: string }
        retentionDefaultDays: { type: integer, minimum: 1, maximum: 3650 }
        updatedAt: { type: string }
        updatedBy: { type: string, nullable: true }
    AppConfigUpdate:
      type: object
      properties:
        severityWeights: { $ref: "#/components/schemas/SeverityWeights" }
        missingEvidenceWeight: { type: integer, minimum: 0, maximum: 100 }
        bandCutoffs: { $ref: "#/components/schemas/BandCutoffs" }
        firmName: { type: string, minLength: 1, maxLength: 120 }
        confidentialityLegend: { type: string, minLength: 1, maxLength: 500 }
        retentionDefaultDays: { type: integer, minimum: 1, maximum: 3650 }
    PaymentConfirmationBody:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [founder, advisor]
    AccessReviewRow:
      type: object
      required: [at, actor, client, project, action, objectType, objectId, details]
      properties:
        at: { type: string }
        actor: { type: string }
        client: { type: string }
        project: { type: string }
        action: { type: string }
        objectType: { type: string }
        objectId: { type: string }
        details: { type: string }
    AccessReview:
      type: object
      required: [month, rows]
      properties:
        month: { type: string }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/AccessReviewRow"

    ClientDocumentSummary:
      type: object
      required: [id, projectId, filename, type]
      properties:
        id: { type: string }
        projectId: { type: string }
        filename: { type: string }
        type: { type: string }
    CapabilityItem:
      type: object
      required: [id, clientId, claimType, approvedStatus, claimable, createdAt]
      properties:
        id: { type: string }
        clientId: { type: string }
        claimType:
          type: string
          enum: [project, personnel, equipment, certification, past_performance, other]
        description: { type: string, nullable: true }
        evidenceDocId: { type: string, nullable: true }
        evidenceDocName: { type: string, nullable: true }
        approvedStatus:
          type: string
          enum: [pending, approved, rejected]
        verifierName: { type: string, nullable: true }
        verifiedAt: { type: string, nullable: true }
        claimable: { type: boolean }
        createdAt: { type: string }
    CapabilityItemCreate:
      type: object
      required: [claimType]
      properties:
        claimType:
          type: string
          enum: [project, personnel, equipment, certification, past_performance, other]
        description: { type: string }
        evidenceDocId: { type: string }
    CapabilityItemUpdate:
      type: object
      properties:
        claimType:
          type: string
          enum: [project, personnel, equipment, certification, past_performance, other]
        description: { type: string }
        evidenceDocId: { type: string, nullable: true }
        approvedStatus:
          type: string
          enum: [pending, approved, rejected]

    VaultItem:
      type: object
      required: [id, clientId, artefactType, status, expiryBand, createdAt]
      properties:
        id: { type: string }
        clientId: { type: string }
        artefactType: { type: string }
        issuer: { type: string, nullable: true }
        issueDate: { type: string, nullable: true }
        expiryDate: { type: string, nullable: true }
        renewalLeadDays: { type: integer, nullable: true }
        status: { type: string }
        objectPath: { type: string, nullable: true }
        sha256: { type: string, nullable: true }
        sourceDocumentId: { type: string, nullable: true }
        expiryBand:
          type: string
          enum: [expired, critical, warning, upcoming, ok, unknown]
        daysToExpiry: { type: integer, nullable: true }
        createdAt: { type: string }
    VaultItemCreate:
      type: object
      required: [artefactType]
      properties:
        artefactType: { type: string, minLength: 1 }
        issuer: { type: string }
        issueDate: { type: string }
        expiryDate: { type: string }
        renewalLeadDays: { type: integer, minimum: 0 }
        status: { type: string }
        sourceDocumentId: { type: string }
    VaultItemUpdate:
      type: object
      properties:
        artefactType: { type: string, minLength: 1 }
        issuer: { type: string }
        issueDate: { type: string }
        expiryDate: { type: string }
        renewalLeadDays: { type: integer, minimum: 0 }
        status: { type: string }
        sourceDocumentId: { type: string, nullable: true }
    VaultExpiringItem:
      allOf:
        - $ref: "#/components/schemas/VaultItem"
        - type: object
          required: [clientName]
          properties:
            clientName: { type: string, nullable: true }
    VaultExpiring:
      type: object
      required: [buckets, items]
      properties:
        buckets:
          type: object
          required: [expired, critical, warning, upcoming]
          properties:
            expired: { type: integer }
            critical: { type: integer }
            warning: { type: integer }
            upcoming: { type: integer }
        items:
