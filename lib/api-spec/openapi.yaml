          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/discard:
    post:
      tags: [Storage]
      operationId: discardUpload
      summary: Discard an unreferenced staged upload after document registration fails
      description: >-
        Deletes only an opaque object in the authenticated organisation's upload
        staging namespace. The server rejects signed URLs, cross-tenant paths,
        quarantine paths, and objects already referenced by any persisted tenant artefact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscardUploadRequest"
      responses:
        "200":
          description: Cleanup completed with an explicit storage disposition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StagedUploadDiscardResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The object is already referenced by a tenant artefact and was not deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Cleanup could not be confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a registered document or vault source object
      description: >-
        Fails closed for unreferenced staging objects, document-version quarantine
        objects, report renders, package outputs, and partner-branding objects.
        Controlled outputs are available only through their guarded download/export routes.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session token. Authentication never implies access to a tenant.
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganisationIdParam:
      name: organisationId
      in: path
      required: true
      description: Organisation identifier. A tenant-scoped operation also verifies the resolved context matches it.
      schema:
        type: string
        format: uuid
    MembershipIdParam:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeatureKeyParam:
      name: key
      in: path
      required: true
      description: Lower-case feature key.
      schema:
        type: string
        minLength: 3
        maxLength: 80
        pattern: "^[a-z][a-z0-9_]{2,79}$"
    OrganisationContextHeader:
      name: X-Valo-Organisation-Id
      in: header
      required: false
      description: |
        Selects the organisation access context. It is required when the caller
        has multiple active direct memberships and always required for a
        partner-managed client tenant or break-glass access. It may be omitted
        only when the server can unambiguously select the caller's sole active
        direct membership. This value never grants access by itself: the server
        revalidates membership, role grants, access windows, relationship and
        commercial state for every request.
      schema:
        type: string
        format: uuid
    BreakGlassSessionHeader:
      name: X-Valo-Break-Glass-Session
      in: header
      required: false
      description: |
        Selects a separately approved emergency session for a tenant request.
        It is valid only when `X-Valo-Organisation-Id` names the session target,
        the authenticated user is the requester, approval came from a distinct
        user, the session is active and unexpired, and the operation needs one
        of the session's read-only permissions. It never enables write actions.
      schema:
        type: string
        format: uuid
    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      description: Current positive integer resource version, optionally quoted or weakly prefixed.
      schema:
        type: string
        pattern: '^(?:W/)?"?[1-9][0-9]*"?$'
      example: '"3"'
    IfMatchVersionOptional:
      name: If-Match
      in: header
      required: false
      description: Required when updating an existing row; omitted when creating the first tenant override.
      schema:
        type: string
        pattern: '^(?:W/)?"?[1-9][0-9]*"?$'
      example: '"3"'
  headers:
    VersionETag:
      description: Quoted optimistic-concurrency version for the returned resource.
      schema:
        type: string
      example: '"4"'
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Account, tenant context, role or permission does not authorise the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TenantSelectionRequired:
      description: Tenant selection is missing or incompatible with another context header
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PreconditionRequired:
      description: A current resource version is required in If-Match
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalServerError:
      description: Authentication or tenant-context resolution failed unexpectedly
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AiInputRejected:
      description: AI input was invalid or exceeded the bounded source limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AiWorkflowErrorEnvelope"
    AiBudgetExceeded:
      description: The approved AI budget cannot cover this request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AiWorkflowErrorEnvelope"
    AiInvalidProviderResult:
      description: The provider result or usage telemetry failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AiWorkflowErrorEnvelope"
    AiUnavailable:
      description: AI is disabled or a required release, model, privacy, region, retention, provider, or capability gate is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AiWorkflowErrorEnvelope"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BidAutopsyRequestCreate:
      type: object
      additionalProperties: false
      required:
        - contactName
        - companyName
        - businessEmail
        - businessTelephone
        - tenderCategory
        - bidStage
        - preferredContactMethod
        - privacyNoticeAcknowledged
        - formStartedAt
      properties:
        contactName:
          type: string
          minLength: 2
          maxLength: 120
        companyName:
          type: string
          minLength: 2
          maxLength: 160
        businessEmail:
          type: string
          format: email
          minLength: 5
          maxLength: 254
        businessTelephone:
          type: string
          minLength: 7
          maxLength: 32
          pattern: '^(?=(?:\D*\d){7,})[+()0-9 .-]{7,32}$'
        tenderCategory:
          type: string
          enum: [federal_public, oil_and_gas, donor_funded, other]
        bidStage:
          type: string
          enum: [live, draft, previously_submitted]
        tenderDeadline:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        preferredContactMethod:
          type: string
          enum: [email, telephone]
        privacyNoticeAcknowledged:
          type: boolean
          const: true
        formStartedAt:
          type: string
          minLength: 20
          maxLength: 35
          description: ISO-8601 time captured when the visitor first opens the form.
        website:
          type: string
          maxLength: 0
          default: ""
          description: Bot-control honeypot. Human-facing clients keep this field empty.
    BidAutopsyRequestAccepted:
      type: object
      additionalProperties: false
      required: [requestId, status, replayed, acceptedAt, nextStep]
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted]
        replayed:
          type: boolean
        acceptedAt:
          type: string
          format: date-time
        nextStep:
          type: string
          description: Generic next-step guidance without an unverified response-time promise.
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    AiWorkflowErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        actualChars: { type: integer, minimum: 0 }
        maxChars: { type: integer, minimum: 1 }
    OrganisationType:
      type: string
      enum: [client, valo, consultancy_partner]
    OrganisationRole:
      type: string
      description: Canonical organisation-scoped role. Legacy identity aliases are never emitted as grants.
      enum:
        - client_organisation_owner
        - client_administrator
        - bid_manager
        - contributor
        - client_reviewer_approver
        - valo_operations_administrator
        - restricted_platform_administrator
        - consultancy_partner_administrator
        - consultancy_partner_analyst_reviewer
        - read_only_auditor
        - valo_analyst
        - valo_quality_adviser
    OrganisationAccessSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - type
        - status
        - countryCode
        - membershipId
        - membershipOrganisationId
        - accessSource
        - partnerRelationshipId
        - accessExpiresAt
        - roles
        - permissions
        - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        type:
          $ref: "#/components/schemas/OrganisationType"
        status:
          type: string
          enum: [active]
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
          example: NG
        membershipId:
          type: string
          format: uuid
          description: Direct or partner-source membership used to authorise this context.
        membershipOrganisationId:
          type: string
          format: uuid
          description: Organisation that owns the authorising membership.
        accessSource:
          type: string
          enum: [membership, partner]
        partnerRelationshipId:
          type: string
          format: uuid
          nullable: true
        accessExpiresAt:
          type: string
          format: date-time
          nullable: true
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/OrganisationRole"
