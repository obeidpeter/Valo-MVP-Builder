  /retention-requests/{id}/complete:
    post:
      operationId: completeRetentionRequest
      tags: [Operations]
      summary: Report that certified retention completion is not activated
      description: >-
        This release fails closed because blob deletion and relational deletion
        cannot yet be certified as one durable two-phase
        detach/reconcile/certify outcome. After authentication and retention
        permission checks, this operation performs no ID lookup, deletion,
        database mutation, audit write or certificate issuance and returns only
        the strict 503 refusal envelope.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Certified retention completion is unavailable and no side effect was applied.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionCompletionUnavailable"
