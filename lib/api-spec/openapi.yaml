              arithmetic,
              formatting,
              responsiveness,
              eligibility,
              unsupported_claim,
              validity,
            ]
        severity:
          type: string
          enum: [fatal, likely_fatal, scoring_risk, cosmetic]
        description: { type: string, minLength: 1 }
        evidenceSnapshot: { type: string }
        remediation: { type: string }
        owner: { type: string }
        status:
          type: string
          enum: [open, remediated, waived, suggested]
    DefectUpdate:
      type: object
      properties:
        requirementId: { type: string }
        type:
          type: string
          enum:
            [
              omission,
              expiry,
              arithmetic,
              formatting,
              responsiveness,
              eligibility,
              unsupported_claim,
              validity,
            ]
        severity:
          type: string
          enum: [fatal, likely_fatal, scoring_risk, cosmetic]
        description: { type: string, minLength: 1 }
        evidenceSnapshot: { type: string }
        remediation: { type: string }
        owner: { type: string }
        status:
          type: string
          enum: [open, remediated, waived, suggested]
        suggested: { type: boolean }
    BoqCheck:
      type: object
      required: [id, projectId, checkType, finding, severity, status, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        sourceDocId: { type: string, nullable: true }
        lineRef: { type: string, nullable: true }
        description: { type: string, nullable: true }
        quantity: { type: number, nullable: true }
        unitRate: { type: number, nullable: true }
        extension: { type: number, nullable: true }
        computedExtension: { type: number, nullable: true }
        quantityRaw: { type: string, nullable: true }
        unitRateKobo: { type: integer, nullable: true }
        extensionKobo: { type: integer, nullable: true }
        computedExtensionKobo: { type: integer, nullable: true }
        checkType:
          type: string
          enum:
            [
              extension_mismatch,
              section_total,
              grand_total,
              words_vs_figures,
              blank_line,
              suspicious_zero,
            ]
        finding: { type: string }
        severity:
          type: string
          enum: [fatal, likely_fatal, scoring_risk, cosmetic]
        status:
          type: string
          enum: [ok, flagged, pushed_to_defect]
        createdAt: { type: string }
    BoqRow:
      type: object
      properties:
        lineRef: { type: string }
        description: { type: string }
        quantity: { type: number, nullable: true }
        unitRate: { type: number, nullable: true }
        extension: { type: number, nullable: true }
        amountInWords: { type: string, nullable: true }
        section: { type: string, nullable: true }
    BoqRunRequest:
      type: object
      required: [rows]
      properties:
        sourceDocId: { type: string }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BoqRow"
        grandTotal: { type: number }
        tolerance: { type: number }
    BoqRunResult:
      type: object
      required: [total, flagged, checks]
      properties:
        total: { type: integer }
        flagged: { type: integer }
        computedGrandTotal: { type: number }
        checks:
          type: array
          items:
            $ref: "#/components/schemas/BoqCheck"
    ResponsivenessResult:
      type: object
      required: [review]
      properties:
        review: { type: string }
        model: { type: string }
    RiskAssessment:
      type: object
      required: [score, band, distribution]
      properties:
        score: { type: number }
        band:
          type: string
          enum: [low, medium, high, critical]
        computedBand:
          type: string
          enum: [low, medium, high, critical]
        overrideBand:
          type: string
          enum: [low, medium, high, critical]
          nullable: true
        overrideNote: { type: string, nullable: true }
        overrideBy: { type: string, nullable: true }
        explanation: { type: string }
        distribution:
          type: array
          items:
            $ref: "#/components/schemas/CountBucket"
    RiskOverride:
      type: object
      required: [band, note]
      properties:
        band:
          type: string
          enum: [low, medium, high, critical]
        note: { type: string, minLength: 1 }
    Report:
      type: object
      required: [id, projectId, version, status, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        version: { type: integer }
        status:
          type: string
          enum: [draft, signed_off]
        docxPath: { type: string, nullable: true }
        pdfPath: { type: string, nullable: true }
        reviewerId: { type: string, nullable: true }
        reviewerName: { type: string, nullable: true }
        attestation: { type: string, nullable: true }
        engineVersion: { type: string, nullable: true }
        promptPackVersion: { type: string, nullable: true }
        modelId: { type: string, nullable: true }
        taxonomyVersion: { type: string, nullable: true }
        signedOffAt: { type: string, nullable: true }
        generatedBy: { type: string, nullable: true }
        generatedByName: { type: string, nullable: true }
        createdAt: { type: string }
    SignOffRequest:
      type: object
      required: [attestation]
      properties:
        attestation: { type: string, minLength: 1 }
    AuditEvent:
      type: object
      required: [id, eventType, createdAt, auditSource, integrityStatus]
      properties:
        id: { type: string }
        userId: { type: string, nullable: true }
        userName: { type: string, nullable: true }
        projectId: { type: string, nullable: true }
        eventType: { type: string }
        objectType: { type: string, nullable: true }
        objectId: { type: string, nullable: true }
        details: { type: string, nullable: true }
        createdAt: { type: string }
        auditSource:
          $ref: "#/components/schemas/AuditSource"
        integrityStatus:
          $ref: "#/components/schemas/AuditIntegrityStatus"
    AuditSource:
      type: string
      enum: [active_v2, legacy_v1_archive]
    AuditIntegrityStatus:
      type: string
      enum: [active_v2_record, payload_hash_verified, known_discontinuity]
    LegacyAuditIntegrityAssessment:
      type: object
      required:
        [
          id,
          organisationId,
          sourceCommit,
          sourceEventCount,
          verifiedRanges,
          discontinuityRanges,
          finding,
          externalHeadSeq,
          externalHeadHash,
          sourceBackupSha256,
          sourceAuditExportSha256,
          rehearsalEvidenceSha256,
          archiveDigest,
          assessedAt,
          createdAt,
          integrityStatus,
        ]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        sourceCommit: { type: string }
        sourceEventCount: { type: integer }
        verifiedRanges: { type: string }
        discontinuityRanges: { type: string }
        finding: { type: string }
        probableCause: { type: string, nullable: true }
        externalHeadSeq: { type: integer }
        externalHeadHash: { type: string }
        sourceBackupSha256: { type: string }
        sourceAuditExportSha256: { type: string }
        rehearsalEvidenceSha256: { type: string }
        archiveDigest: { type: string }
        assessedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        integrityStatus:
          type: string
          enum: [KNOWN_DISCONTINUITY]
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 1
          maximum: 104857600
        contentType:
          type: string
          minLength: 1
          maxLength: 255
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    DiscardUploadRequest:
      type: object
      additionalProperties: false
      required: [objectPath]
      properties:
        objectPath:
          type: string
          minLength: 1
          maxLength: 512
    StagedUploadDiscardResult:
      type: object
      additionalProperties: false
      required: [disposition, quarantineMayRetainCopy]
      properties:
        disposition:
          type: string
          enum: [deleted, already_absent]
        quarantineMayRetainCopy:
          type: boolean
