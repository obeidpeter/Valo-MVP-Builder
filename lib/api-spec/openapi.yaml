      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: The declared upload size exceeds the deployment intake limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/discard:
    post:
      tags: [Storage]
      operationId: discardUpload
      summary: Discard an unreferenced staged upload after document registration fails
      description: >-
        Deletes only an opaque object in the authenticated organisation's upload
        staging namespace. The server rejects signed URLs, cross-tenant paths,
        quarantine paths, and objects already referenced by any persisted tenant artefact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscardUploadRequest"
      responses:
        "200":
          description: Cleanup completed with an explicit storage disposition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StagedUploadDiscardResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The object is already referenced by a tenant artefact and was not deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Cleanup could not be confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a registered document or vault source object
      description: >-
        Fails closed for unreferenced staging objects, document-version quarantine
        objects, report renders, package outputs, and partner-branding objects.
        Controlled outputs are available only through their guarded download/export routes.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session token. Authentication never implies access to a tenant.
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperationsRecordIdParam:
      name: recordId
      in: path
      required: true
      description: Operations record UUID within the active tenant and project.
      schema:
        type: string
        format: uuid
    GrowthItemIdParam:
      name: id
      in: path
      required: true
      description: Bounded lead or quote identifier within the active tenant.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:@-]*$"
    GrowthListLimit:
      name: limit
      in: query
      required: false
      description: Maximum bounded rows to return.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 25
    WorkInboxLimit:
      name: limit
      in: query
      required: false
      description: Maximum total items across all four groups. The wire value is one to three decimal digits with no leading zero.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CanonicalEvidenceProjectId:
      name: projectId
      in: query
      required: false
      description: Optional exact project scope within the selected tenant.
      schema:
        type: string
        format: uuid
    CanonicalEvidenceLimit:
      name: limit
      in: query
      required: false
      description: Maximum canonical evidence options. The wire value is one to three decimal digits with no leading zero.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ProjectIdParam:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvidenceRenewalPlanIdParam:
      name: planId
      in: path
      required: true
      description: Receipt-backed evidence-renewal plan identifier.
      schema:
        type: string
        format: uuid
    ClientSlotIdParam:
      name: slotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClientActionUploadLeaseIdParam:
      name: leaseId
      in: path
      required: true
      description: Deterministic governed upload-lease identifier bound to the exact idempotency identity.
      schema:
        type: string
        format: uuid
    ClientActionUploadIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable 16-to-128-code-unit identity. Leading or trailing whitespace,
        control characters and unpaired UTF-16 surrogates are rejected; reuse
        is accepted only for the exact governed upload material.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[^\s\u0000-\u001f\u007f\ud800-\udfff](?:[^\u0000-\u001f\u007f\ud800-\udfff]*[^\s\u0000-\u001f\u007f\ud800-\udfff])$'
    OpportunityCandidateIdParam:
      name: candidateId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OpportunityHandoffCandidateIdParam:
      name: candidateId
      in: path
      required: true
      description: Accepted opportunity-source candidate identifier.
      schema:
        type: string
        format: uuid
    OpportunityHandoffIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable confirmation identity; reuse is accepted only for the exact same request.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$"
    FieldDraftPromotionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable UUID persisted with the content-free promotion receipt.
      schema:
        type: string
        format: uuid
    CommunicationEventIdParam:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommercialProjectIdQuery:
      name: projectId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    CommercialOrderIdParam:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommercialInvoiceIdParam:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommercialPaymentIdParam:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommercialRequestIdParam:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelationshipIdParam:
      name: relationshipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResponsibilityIdParam:
      name: responsibilityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QaItemIdParam:
      name: qaItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AiShadowPlanIdParam:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PrivacyOperationsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 25
    OrganisationIdParam:
      name: organisationId
      in: path
      required: true
      description: Organisation identifier. A tenant-scoped operation also verifies the resolved context matches it.
      schema:
        type: string
        format: uuid
    MembershipIdParam:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeatureKeyParam:
      name: key
      in: path
      required: true
      description: Lower-case feature key.
      schema:
        type: string
        minLength: 3
        maxLength: 80
        pattern: "^[a-z][a-z0-9_]{2,79}$"
    OrganisationContextHeader:
      name: X-Valo-Organisation-Id
      in: header
      required: false
      description: |
        Selects the organisation access context. It is required when the caller
        has multiple active direct memberships and always required for a
        partner-managed client tenant or break-glass access. It may be omitted
        only when the server can unambiguously select the caller's sole active
        direct membership. This value never grants access by itself: the server
        revalidates membership, role grants, access windows, relationship and
        commercial state for every request.
      schema:
        type: string
        format: uuid
    BreakGlassSessionHeader:
      name: X-Valo-Break-Glass-Session
      in: header
      required: false
      description: |
        Selects a separately approved emergency session for a tenant request.
        It is valid only when `X-Valo-Organisation-Id` names the session target,
        the authenticated user is the requester, approval came from a distinct
        user, the session is active and unexpired, and the operation needs one
        of the session's read-only permissions. It never enables write actions.
      schema:
        type: string
        format: uuid
    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      description: Current positive integer resource version, optionally quoted or weakly prefixed.
      schema:
        type: string
        pattern: '^(?:W/)?"?[1-9][0-9]*"?$'
      example: '"3"'
    IfMatchVersionOptional:
      name: If-Match
      in: header
      required: false
      description: Required when updating an existing row; omitted when creating the first tenant override.
      schema:
        type: string
        pattern: '^(?:W/)?"?[1-9][0-9]*"?$'
      example: '"3"'
  headers:
    VersionETag:
      description: Quoted optimistic-concurrency version for the returned resource.
      schema:
        type: string
      example: '"4"'
    PrivateNoStore:
      description: Prevents shared or browser caches from retaining tenant data.
      required: true
      schema:
        type: string
        const: private, no-store
    CommercialPrivateNoStore:
      description: Prevents retention and revalidation of commercial tenant data.
      required: true
      schema:
        type: string
        const: private, no-store, max-age=0, must-revalidate
    VaryOrganisationContext:
      description: Keeps tenant-selected responses distinct at every intermediary.
      required: true
      schema:
        type: string
        const: X-Valo-Organisation-Id
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Account, tenant context, role or permission does not authorise the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TenantSelectionRequired:
      description: Tenant selection is missing or incompatible with another context header
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PreconditionRequired:
      description: A current resource version is required in If-Match
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalServerError:
      description: Authentication, tenant-context resolution or request processing failed unexpectedly
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AiInputRejected:
      description: AI input was invalid or exceeded the bounded source limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AiWorkflowErrorEnvelope"
    AiBudgetExceeded:
      description: The approved AI budget cannot cover this request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AiWorkflowErrorEnvelope"
    AiInvalidProviderResult:
      description: The provider result or usage telemetry failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AiWorkflowErrorEnvelope"
    AiUnavailable:
      description: AI is disabled or a required release, model, privacy, region, retention, provider, or capability gate is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AiWorkflowErrorEnvelope"
    GrowthSuiteUnavailable:
      description: The durable growth operations repository is not available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RoadmapRepositoryUnavailable:
      description: The fail-closed durable repository or required activation evidence is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RoadmapCapacityExceeded:
      description: A bounded request, record set or durable ledger capacity was exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RoadmapPolicyDenied:
      description: A human-control, consent, maker-checker, evidence or authority invariant denied the action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ClientActionUploadBadRequest:
      description: The bounded metadata request, path identity or Idempotency-Key is invalid.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ClientActionUploadTransportError"
              - $ref: "#/components/schemas/ClientActionUploadInvalidRequestError"
    ClientActionUploadUnauthorized:
      description: The caller is not authenticated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientActionUploadTransportError"
    ClientActionUploadForbidden:
      description: The current direct membership, tenant scope or document-upload authority is denied.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ClientActionUploadTransportError"
              - $ref: "#/components/schemas/ClientActionUploadScopeDeniedError"
    ClientActionUploadNotFound:
      description: The exact-scope project, evidence request or governed lease was not found.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ClientActionUploadTransportError"
              - $ref: "#/components/schemas/ClientActionUploadNotFoundError"
    ClientActionUploadConflict:
      description: The record version, active slot intent, lease binding, persisted receipt or storage disposition conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientActionUploadConflictError"
    ClientActionUploadExpired:
      description: The database-backed 15-minute upload lease expired before this operation completed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientActionUploadExpiredError"
    ClientActionUploadCapacityExceeded:
      description: The 4,096-byte metadata-body bound or 200-active-lease project bound was exceeded.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ClientActionUploadTransportError"
              - $ref: "#/components/schemas/ClientActionUploadCapacityExceededError"
    ClientActionUploadIntakeRejected:
      description: The staged object was missing, mismatched, unsafe or quarantined by secure intake.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientActionUploadIntakeRejectedError"
    ClientActionUploadInternalError:
      description: Authentication, tenant transaction commit or unexpected request processing failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientActionUploadTransportError"
    ClientActionUploadUnavailable:
      description: A required governed database identity or secure-intake capability is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientActionUploadUnavailableError"
    EvidenceRenewalConflict:
      description: The renewal plan, authority, receipt identity, evidence, vault projection or expected version conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EvidenceRenewalMutationError"
    EvidenceRenewalNotFound:
      description: The exact-scope project or renewal plan was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EvidenceRenewalMutationError"
    EvidenceRenewalCapacityExceeded:
      description: The bounded project renewal ledger has reached its safe record capacity.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EvidenceRenewalMutationError"
    EvidenceRenewalUnavailable:
      description: The governed evidence-renewal repository or projection is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EvidenceRenewalUnavailableError"
    OperationsBadRequest:
      description: The bounded operations request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationsSuiteErrorEnvelope"
    OperationsForbidden:
      description: Tenant, project, permission or referenced-resource scope is denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationsSuiteErrorEnvelope"
    OperationsNotFound:
      description: The exact-scope operations record was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationsSuiteErrorEnvelope"
    OperationsConflict:
      description: The record changed, already exists or conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationsSuiteErrorEnvelope"
    OperationsPayloadTooLarge:
      description: The request or bounded operations materialisation limit was exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationsSuiteErrorEnvelope"
    OperationsPolicyDenied:
      description: A human-control, transition, evidence or identity invariant denied the action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationsSuiteErrorEnvelope"
  schemas:
    ProductionAcceptanceEvidenceDraft:
      type: object
      additionalProperties: false
      required:
        [
          category,
          outcome,
          environment,
          releaseSha256,
          ownerUserId,
          observedAt,
          expiresAt,
          evidenceReference,
          artifactSha256,
          summary,
          idempotencyKey,
        ]
      properties:
        category:
          type: string
          enum:
            [
              migration,
              rls,
              tenant_isolation,
              browser_accessibility,
              backup,
              restore,
              rollback,
            ]
        outcome: { type: string, enum: [passed, failed] }
        environment:
          { type: string, enum: [staging, production, recovery_rehearsal] }
        releaseSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        ownerUserId: { type: string, format: uuid }
        observedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        evidenceReference: { type: string, minLength: 1, maxLength: 256 }
        artifactSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        summary: { type: string, minLength: 1, maxLength: 1000 }
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 128
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9._:-]{15,127}$"
    ProductionAcceptanceEvidenceRecord:
      type: object
      additionalProperties: false
      required:
        [
          schema,
          id,
          organisationId,
          category,
          outcome,
          environment,
          releaseSha256,
          ownerUserId,
          verifiedByUserId,
          observedAt,
          expiresAt,
          evidenceReference,
          artifactSha256,
          summary,
          recordedAt,
          evidenceDigest,
        ]
      properties:
        schema: { type: string, const: valo.production-acceptance-evidence/v1 }
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        category:
          type: string
          enum:
            [
              migration,
              rls,
              tenant_isolation,
              browser_accessibility,
              backup,
              restore,
              rollback,
            ]
        outcome: { type: string, enum: [passed, failed] }
        environment:
          { type: string, enum: [staging, production, recovery_rehearsal] }
        releaseSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        ownerUserId: { type: string, format: uuid }
        verifiedByUserId: { type: string, format: uuid }
        observedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        evidenceReference: { type: string, minLength: 1, maxLength: 256 }
        artifactSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        summary: { type: string, minLength: 1, maxLength: 1000 }
        recordedAt: { type: string, format: date-time }
        evidenceDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
    ProductionAcceptanceCategorySnapshot:
      type: object
      additionalProperties: false
      required: [category, label, state, required, latestEvidence]
      properties:
        category:
          type: string
          enum:
            [
              migration,
              rls,
              tenant_isolation,
              browser_accessibility,
              backup,
              restore,
              rollback,
            ]
        label: { type: string, minLength: 1 }
        state:
          {
            type: string,
            enum:
              [
                passed,
                failed,
                missing,
                expired,
                release_mismatch,
                integrity_failed,
              ],
          }
        required: { type: boolean, const: true }
        latestEvidence:
          oneOf:
            - $ref: "#/components/schemas/ProductionAcceptanceEvidenceRecord"
            - type: "null"
    ProductionAcceptanceBlocker:
      type: object
      additionalProperties: false
      required: [code, category, message]
      properties:
        code: { type: string, minLength: 1 }
        category:
          type: [string, "null"]
          enum:
            [
              migration,
              rls,
              tenant_isolation,
              browser_accessibility,
              backup,
              restore,
              rollback,
              null,
            ]
        message: { type: string, minLength: 1 }
    ProductionAcceptanceSnapshot:
      type: object
      additionalProperties: false
      required:
        [
          generatedAt,
          organisationId,
          expectedReleaseSha256,
          recommendedDecision,
          deploymentAuthorized,
          requiresNamedHumanApproval,
          categories,
          blockers,
          authorityNote,
        ]
      properties:
        generatedAt: { type: string, format: date-time }
        organisationId: { type: string, format: uuid }
        expectedReleaseSha256:
          { type: [string, "null"], pattern: "^[a-f0-9]{64}$" }
        recommendedDecision: { type: string, enum: [go, no_go] }
        deploymentAuthorized: { type: boolean, const: false }
        requiresNamedHumanApproval: { type: boolean, const: true }
        categories:
          type: array
          maxItems: 7
          items:
            $ref: "#/components/schemas/ProductionAcceptanceCategorySnapshot"
        blockers:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/ProductionAcceptanceBlocker"
        authorityNote: { type: string, minLength: 1 }
    ProductionAcceptanceAuthority:
      type: object
      additionalProperties: false
      required: [userId, name]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 512 }
    ProductionAcceptanceAuthorityList:
      type: object
      additionalProperties: false
      required: [organisationId, items, limit, truncated]
      properties:
        organisationId: { type: string, format: uuid }
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ProductionAcceptanceAuthority"
        limit: { type: integer, const: 100 }
        truncated: { type: boolean, const: false }
    ProductionAcceptanceEvidenceMutation:
      type: object
      additionalProperties: false
      required: [record, replayed, deploymentAuthorized, authorityNote]
      properties:
        record:
          $ref: "#/components/schemas/ProductionAcceptanceEvidenceRecord"
        replayed: { type: boolean }
        deploymentAuthorized: { type: boolean, const: false }
        authorityNote: { type: string, minLength: 1 }
    CreateClientEvidenceRequestInput:
      type: object
      additionalProperties: false
      required: [purpose, purposeStatement, recipientUserId, slots]
      properties:
        purpose:
          {
            type: string,
            enum:
              [
                tender_evidence,
                credential_refresh,
                clarification_support,
                delivery_evidence,
              ],
          }
        purposeStatement: { type: string, minLength: 1, maxLength: 1000 }
        recipientUserId: { type: string, format: uuid }
        dueAt: { type: [string, "null"], format: date-time }
        slots:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ClientEvidenceSlotInput"
    ClientEvidenceSlotInput:
      type: object
      additionalProperties: false
      required: [label, required]
      properties:
        label: { type: string, minLength: 1, maxLength: 160 }
        required: { type: boolean }
        acceptedContentTypes:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 160 }
    ClientAcknowledgementInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, statement]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        statement: { type: string, minLength: 1, maxLength: 1000 }
    ClientActionUploadLeaseRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, intentId]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Exact current evidence-request record version.
        intentId:
          type: string
          format: uuid
          description: Latest unfinalized intent in the named active request slot.
    ClientActionUploadLeaseGrant:
      type: object
      additionalProperties: false
      required:
        [
          leaseId,
          recordId,
          slotId,
          intentId,
          recordVersion,
          objectPath,
          uploadUrl,
          filename,
          contentType,
          sizeBytes,
          declaredSha256,
          expiresAt,
          replayed,
          lateRewriteClosure,
          rawFileAcceptedByApi,
          externalMessageSentByValo,
        ]
      properties:
        leaseId: { type: string, format: uuid }
        recordId: { type: string, format: uuid }
        slotId: { type: string, format: uuid }
        intentId: { type: string, format: uuid }
        recordVersion:
          { type: integer, minimum: 1, maximum: 9007199254740991 }
        objectPath:
          type: string
          maxLength: 512
          pattern: '^/objects/tenants/[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/uploads/[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        uploadUrl:
          type: string
          format: uri
          maxLength: 8192
          description: HTTPS signed PUT URL; loopback HTTP is allowed only in local development.
        filename: { type: string, minLength: 1, maxLength: 255 }
        contentType:
          type: string
          enum:
            [
              application/pdf,
              application/vnd.openxmlformats-officedocument.wordprocessingml.document,
              application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,
              application/zip,
              application/x-zip-compressed,
              image/png,
              image/jpeg,
            ]
        sizeBytes: { type: integer, minimum: 1, maximum: 52428800 }
        declaredSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        expiresAt: { type: string, format: date-time }
        replayed: { type: boolean }
        lateRewriteClosure:
          {
            type: string,
            const: bounded-cushion-and-post-expiry-reconcile,
          }
        rawFileAcceptedByApi: { type: boolean, const: false }
        externalMessageSentByValo: { type: boolean, const: false }
    ClientActionUploadLeaseReplayGrant:
      allOf:
        - $ref: "#/components/schemas/ClientActionUploadLeaseGrant"
        - type: object
          required: [replayed]
          properties:
            replayed: { type: boolean, const: true }
    ClientActionUploadLeaseCreatedGrant:
      allOf:
        - $ref: "#/components/schemas/ClientActionUploadLeaseGrant"
        - type: object
          required: [replayed]
          properties:
            replayed: { type: boolean, const: false }
    ClientActionUploadFinalizationReceipt:
      type: object
      additionalProperties: false
      required:
        [
          leaseId,
          recordId,
          slotId,
          intentId,
          recordVersion,
          documentId,
          documentVersionId,
          filename,
          sha256,
          sizeBytes,
          detectedMime,
          receiptSha256,
          replayed,
          extractionStarted,
          rawFileAcceptedByApi,
          externalMessageSentByValo,
        ]
      properties:
        leaseId: { type: string, format: uuid }
        recordId: { type: string, format: uuid }
        slotId: { type: string, format: uuid }
        intentId: { type: string, format: uuid }
        recordVersion:
          { type: integer, minimum: 1, maximum: 9007199254740991 }
        documentId: { type: string, format: uuid }
        documentVersionId: { type: string, format: uuid }
        filename: { type: string, minLength: 1, maxLength: 255 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        sizeBytes: { type: integer, minimum: 1, maximum: 52428800 }
        detectedMime:
          type: string
          enum:
            [
              application/pdf,
              application/vnd.openxmlformats-officedocument.wordprocessingml.document,
              application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,
              application/zip,
              image/png,
              image/jpeg,
            ]
        receiptSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        replayed: { type: boolean }
        extractionStarted: { type: boolean, const: false }
        rawFileAcceptedByApi: { type: boolean, const: false }
        externalMessageSentByValo: { type: boolean, const: false }
    ClientActionUploadFinalizationReplayReceipt:
      allOf:
        - $ref: "#/components/schemas/ClientActionUploadFinalizationReceipt"
        - type: object
          required: [replayed]
          properties:
            replayed: { type: boolean, const: true }
    ClientActionUploadFinalizationCreatedReceipt:
      allOf:
        - $ref: "#/components/schemas/ClientActionUploadFinalizationReceipt"
        - type: object
          required: [replayed]
          properties:
            replayed: { type: boolean, const: false }
    ClientActionUploadTransportError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, minLength: 1 }
    ClientActionUploadGovernedError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error: { type: string, minLength: 1 }
        code:
          type: string
          enum:
            [
              invalid_request,
              scope_denied,
              not_found,
              stale_version,
              conflict,
              expired,
              capacity_exceeded,
              intake_rejected,
              cleanup_unconfirmed,
              unavailable,
            ]
        leaseStatus: { type: string, minLength: 1, maxLength: 64 }
        references:
          type: array
          maxItems: 7
          uniqueItems: true
          items:
            {
              type: string,
              enum:
                [
                  document,
                  document_version,
                  vault_item,
                  report,
                  package_version,
                  partner_branding,
                  upload_session,
                ],
            }
        findings:
          type: array
          maxItems: 19
          uniqueItems: true
          items:
            type: string
            enum:
              [
                filename_unsafe,
                empty_file,
                file_too_large,
                page_limit_exceeded,
                unsupported_format,
                mime_signature_mismatch,
                password_protected,
                corrupt_file,
                malware_detected,
                malware_scan_incomplete,
                archive_manifest_missing,
                archive_entry_limit,
                archive_expansion_limit,
                archive_bomb_suspected,
                archive_path_traversal,
                archive_executable,
                archive_encrypted,
                idempotency_key_missing,
                duplicate_document,
              ]
        cleanupConfirmed: { type: boolean }
        quarantinedPath:
          { type: [string, "null"], minLength: 1, maxLength: 512 }
        possibleQuarantinedPath:
          { type: [string, "null"], minLength: 1, maxLength: 512 }
        quarantineCopyConfirmed: { type: boolean }
        activation: { type: string, const: blocked }
        sideEffectsApplied: { type: boolean, const: false }
    ClientActionUploadInvalidRequestError:
      allOf:
        - $ref: "#/components/schemas/ClientActionUploadGovernedError"
        - type: object
          required: [code]
          properties:
            code: { type: string, const: invalid_request }
    ClientActionUploadScopeDeniedError:
      allOf:
        - $ref: "#/components/schemas/ClientActionUploadGovernedError"
        - type: object
          required: [code]
          properties:
            code: { type: string, const: scope_denied }
    ClientActionUploadNotFoundError:
      allOf:
        - $ref: "#/components/schemas/ClientActionUploadGovernedError"
        - type: object
          required: [code]
          properties:
            code: { type: string, const: not_found }
    ClientActionUploadConflictError:
      allOf:
        - $ref: "#/components/schemas/ClientActionUploadGovernedError"
        - type: object
          required: [code]
          properties:
            code:
              {
                type: string,
                enum: [stale_version, conflict, cleanup_unconfirmed],
              }
    ClientActionUploadExpiredError:
      allOf:
        - $ref: "#/components/schemas/ClientActionUploadGovernedError"
        - type: object
          required: [code]
          properties:
            code: { type: string, const: expired }
    ClientActionUploadCapacityExceededError:
      allOf:
        - $ref: "#/components/schemas/ClientActionUploadGovernedError"
        - type: object
          required: [code]
          properties:
            code: { type: string, const: capacity_exceeded }
    ClientActionUploadIntakeRejectedError:
      allOf:
        - $ref: "#/components/schemas/ClientActionUploadGovernedError"
        - type: object
          required: [code]
          properties:
            code: { type: string, const: intake_rejected }
    ClientActionUploadUnavailableError:
      allOf:
        - $ref: "#/components/schemas/ClientActionUploadGovernedError"
        - type: object
          required: [code]
          properties:
            code: { type: string, const: unavailable }
    ClientUploadIntentInput:
      type: object
      additionalProperties: false
      required:
        [expectedVersion, filename, contentType, sizeBytes, declaredSha256]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        filename: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, minLength: 1, maxLength: 160 }
        sizeBytes: { type: integer, minimum: 1, maximum: 52428800 }
        declaredSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    ClientAttachDocumentInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, intentId, documentId, sha256]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        intentId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    ClientSlotReviewInput:
      type: object
      additionalProperties: false
      required: [expectedVersion, decision, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        decision: { type: string, enum: [accepted, correction_required] }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    CreateClientPackageDeliveryInput:
      type: object
      additionalProperties: false
      required:
        [
          recipientUserId,
          packageVersionId,
          manifestSha256,
          releaseReceiptSha256,
        ]
      properties:
        recipientUserId: { type: string, format: uuid }
        packageVersionId: { type: string, format: uuid }
        manifestSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        releaseReceiptSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    ClientUploadIntent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          filename,
          contentType,
          sizeBytes,
          declaredSha256,
          recordedByUserId,
          recordedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, minLength: 1, maxLength: 160 }
        sizeBytes: { type: integer, minimum: 1, maximum: 52428800 }
        declaredSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        recordedByUserId: { type: string, format: uuid }
        recordedAt: { type: string, format: date-time }
    ClientAttachedDocument:
      type: object
      additionalProperties: false
      required: [documentId, sha256, attachedByUserId, attachedAt]
      properties:
        documentId: { type: string, format: uuid }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        attachedByUserId: { type: string, format: uuid }
        attachedAt: { type: string, format: date-time }
    ClientSlotReview:
      type: object
      additionalProperties: false
      required: [decision, reason, reviewedByUserId, reviewedAt]
      properties:
        decision: { type: string, enum: [accepted, correction_required] }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        reviewedByUserId: { type: string, format: uuid }
        reviewedAt: { type: string, format: date-time }
    ClientCorrectionAcknowledgement:
      type: object
      additionalProperties: false
      required: [statement, acknowledgedByUserId, acknowledgedAt]
      properties:
        statement: { type: string, minLength: 1, maxLength: 1000 }
        acknowledgedByUserId: { type: string, format: uuid }
        acknowledgedAt: { type: string, format: date-time }
    ClientEvidenceAttempt:
      type: object
      additionalProperties: false
      required: [id, intent, document, review, correctionAcknowledgement]
      properties:
        id: { type: string, format: uuid }
        intent:
          $ref: "#/components/schemas/ClientUploadIntent"
        document:
          oneOf:
            - $ref: "#/components/schemas/ClientAttachedDocument"
            - type: "null"
        review:
          oneOf:
            - $ref: "#/components/schemas/ClientSlotReview"
            - type: "null"
        correctionAcknowledgement:
          oneOf:
            - $ref: "#/components/schemas/ClientCorrectionAcknowledgement"
            - type: "null"
    ClientEvidenceSlot:
      type: object
      additionalProperties: false
      required: [id, label, required, acceptedContentTypes, attempts]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 160 }
        required: { type: boolean }
        acceptedContentTypes:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 160 }
        attempts:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ClientEvidenceAttempt"
    ClientRequestAcknowledgement:
      type: object
      additionalProperties: false
      required: [statement, acknowledgedByUserId, acknowledgedAt]
      properties:
        statement: { type: string, minLength: 1, maxLength: 1000 }
        acknowledgedByUserId: { type: string, format: uuid }
        acknowledgedAt: { type: string, format: date-time }
    ClientEvidenceRequestRecord:
      type: object
      additionalProperties: false
      required:
        [
          id,
          kind,
          organisationId,
          projectId,
          version,
          createdByUserId,
          createdAt,
          updatedByUserId,
          updatedAt,
          purpose,
          purposeStatement,
          recipientUserId,
          dueAt,
          status,
          requestAcknowledgement,
          slots,
          completionReceiptSha256,
