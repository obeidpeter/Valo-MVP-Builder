openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 2.5.0
  description: |
    Valo multi-tenant tender platform API.

    Except for health and organisation discovery/bootstrap operations, protected
    tenant operations resolve an organisation access context on the server. The
    `X-Valo-Organisation-Id` header selects a tenant; it is mandatory when a
    caller has more than one active direct membership, when accessing a client
    through an approved partner relationship, and whenever break-glass access is
    used. The header is only a selector: the server independently validates the
    authenticated user's active membership, role grants, access windows, partner
    relationship, commercial activation, and break-glass approval.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Public Intake
    description: Bounded pre-account first-contact intake without tender-document upload
  - name: Auth
    description: Current-user and user administration
  - name: Clients
    description: Client profiles and NDA status
  - name: Projects
    description: Tender/bid autopsy projects
  - name: Dashboard
    description: Dashboard aggregates and Gate 0 metrics
  - name: Documents
    description: Document intake and classification
  - name: Requirements
    description: Requirement matrix
  - name: Evidence
    description: Evidence mapping
  - name: Defects
    description: Defect register
  - name: BOQ
    description: BOQ Lite arithmetic checks
  - name: Risk
    description: Disqualification-risk scoring
  - name: Reports
    description: DOCX report generation and sign-off
  - name: Audit
    description: Audit trail
  - name: Operations
    description: Internal workflow controls, notifications, retention and alerts
  - name: AI Operations
    description: Sanitised tenant-scoped AI readiness, capability and evaluation telemetry
  - name: Intelligence
    description: Deterministic, source-backed decision-support projections for human review
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Organisations
    description: Organisation discovery, bootstrap and membership administration
  - name: Partner Access
    description: Two-sided consultancy partner relationship lifecycle
  - name: Break Glass
    description: Short-lived, independently approved emergency read access
  - name: Feature Flags
    description: Tenant feature configuration and platform-controlled commercial activation
security:
  - clerkBearer: []
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/bid-autopsy-requests:
    post:
      security: []
      operationId: submitBidAutopsyRequest
      tags: [Public Intake]
      summary: Request a Bid Autopsy
      description: |
        Stores one bounded first-contact request in Valo's authorised intake
        database. The route requires an exact same-origin browser request, JSON,
        a stable idempotency key and privacy-respecting bot controls. It never
        accepts tender files, commercial schedules or unbounded tender details.
        Replaying the same key with the same payload returns the original request;
        reusing it for a different payload is rejected.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Client-generated UUID retained unchanged across retries of one form
            submission. It is hashed before storage and is not an authentication
            credential.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidAutopsyRequestCreate"
      responses:
        "202":
          description: The request was stored exactly once, or an identical retry resolved to the stored request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BidAutopsyRequestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: The browser origin is missing or is not an approved same-origin deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: The request body exceeds the public-intake limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: The request media type or content encoding is not supported JSON input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many public-intake attempts.
          headers:
            Retry-After:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: The authorised intake destination is not currently available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: Get the current authenticated user (JIT provisioned)
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users:
    get:
      operationId: listUsers
      tags: [Auth]
      summary: List internal users (admin only)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [Auth]
      summary: Update a user's role or status (admin only)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
  /organisations:
    get:
      operationId: listOrganisations
      tags: [Organisations]
      summary: List the caller's active organisation access contexts
      description: |
        Discovery endpoint used before tenant selection. It returns active
        direct memberships and client contexts reached through an active
        consultancy-partner relationship with partner edition enabled. Every
        row includes the server-computed effective permission set; projected
        rows contain only the restricted partner-derived permissions. No
        organisation context header is required.
      responses:
        "200":
          description: Active organisation access available to the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganisationAccessSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createOrganisation
      tags: [Organisations]
      summary: Bootstrap an organisation
      description: |
        Creates an organisation, a direct membership for the caller, and the
        organisation-type owner role in one transaction. Restricted platform
        administrator identity bootstrap authority is required; this operation
        does not select or grant access to any existing tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationCreate"
      responses:
        "201":
          description: Organisation and bootstrap membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /organisations/{organisationId}/memberships:
    parameters:
      - $ref: "#/components/parameters/OrganisationIdParam"
      - $ref: "#/components/parameters/OrganisationContextHeader"
    get:
      operationId: listOrganisationMemberships
      tags: [Organisations]
      summary: List organisation memberships and role grants
      description: |
        Requires `membership:read`. The resolved tenant must match the path
        organisation. The header may be omitted only when the server can
        unambiguously select the caller's sole active direct membership.
      responses:
        "200":
          description: Memberships and non-revoked role grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganisationMembershipView"
        "400":
          $ref: "#/components/responses/TenantSelectionRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createOrganisationMembership
      tags: [Organisations]
      summary: Add or reactivate a membership and grant a role
      description: |
        Requires `membership:manage` from a direct membership in the selected
        organisation. Delegation ceilings and organisation-role compatibility
        are re-evaluated from locked, live grants by the server. A lower-level
        administrator cannot reactivate a membership that retains a live or
        scheduled higher-authority grant, and self-service role grants are
        denied. Partner and break-glass contexts cannot administer memberships.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationMembershipCreate"
      responses:
        "201":
          description: Membership role granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationMembershipGrantResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /organisations/{organisationId}/memberships/{membershipId}:
    parameters:
      - $ref: "#/components/parameters/OrganisationIdParam"
      - $ref: "#/components/parameters/MembershipIdParam"
      - $ref: "#/components/parameters/OrganisationContextHeader"
    patch:
      operationId: updateOrganisationMembership
      tags: [Organisations]
      summary: Update membership status or access expiry
      description: |
        Requires `membership:manage` from a direct membership. The optimistic
        membership version must be supplied in `If-Match`; stale versions fail
        without mutation. Live grants, self-change safeguards, and the last
        active administrator/owner invariant are checked under an organisation
        transaction lock. Denied hierarchy changes are audited. An ETag
        containing the new version is returned.
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationMembershipUpdate"
      responses:
        "200":
          description: Updated membership record
          headers:
            ETag:
              $ref: "#/components/headers/VersionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationMembershipRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /partner-relationships:
    parameters:
      - $ref: "#/components/parameters/OrganisationContextHeader"
    get:
      operationId: listPartnerRelationships
      tags: [Partner Access]
      summary: List partner relationships for the selected organisation
      description: |
        Requires `partner_relationship:read`. Results are limited to rows where
        the selected organisation is either the consultancy partner or client.
      responses:
        "200":
          description: Partner relationships visible to the selected organisation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartnerRelationship"
        "400":
          $ref: "#/components/responses/TenantSelectionRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createPartnerRelationship
      tags: [Partner Access]
      summary: Request a consultancy partner relationship
      description: |
        Requires `partner_relationship:manage` from a direct membership in a
        consultancy partner organisation. The target must be an active client
        organisation. Creation does not grant client-tenant access; the client
        must separately approve the pending relationship.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerRelationshipCreate"
      responses:
        "201":
          description: Pending relationship created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerRelationship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /partner-relationships/{id}/approve:
    post:
      operationId: approvePartnerRelationship
      tags: [Partner Access]
      summary: Approve a pending partner relationship
      description: |
        Requires `partner_relationship:manage` from a direct membership in the
        client organisation named by the relationship. The client tenant must
        have `partner_edition` commercially activated. The relationship version
        supplied in `If-Match` prevents stale approval.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/OrganisationContextHeader"
        - $ref: "#/components/parameters/IfMatchVersion"
      responses:
        "200":
          description: Active partner relationship
          headers:
            ETag:
              $ref: "#/components/headers/VersionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerRelationship"
        "400":
          $ref: "#/components/responses/TenantSelectionRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /break-glass/sessions:
    get:
      operationId: listBreakGlassSessions
      tags: [Break Glass]
      summary: List the caller's break-glass requests
      description: |
        Returns only sessions requested by the authenticated user. It does not
        expose another requester's sessions or approve access. No tenant context
        header is used for lifecycle discovery.
      responses:
        "200":
          description: Break-glass requests owned by the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BreakGlassSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createBreakGlassSession
      tags: [Break Glass]
      summary: Request short-lived emergency read access
      description: |
        Requires an active `valo_operations_administrator` grant in a Valo
        organisation. Permissions must be a non-empty subset of the read-only
        emergency allow-list. Creation remains pending and grants no access
        until a distinct restricted platform administrator approves it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BreakGlassSessionCreate"
      responses:
        "201":
          description: Pending break-glass request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakGlassSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /break-glass/sessions/{id}/approve:
    post:
      operationId: approveBreakGlassSession
      tags: [Break Glass]
      summary: Independently approve a pending break-glass request
      description: |
        Restricted platform administrator identity authority is required. The
        approver must be different from the requester. Approval starts a fresh
        access window capped at 60 minutes; the returned session identifier must
        later accompany the target organisation header on emergency requests.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Active, independently approved break-glass session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakGlassSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /break-glass/sessions/{id}:
    delete:
      operationId: revokeBreakGlassSession
      tags: [Break Glass]
      summary: Revoke or cancel a break-glass session
      description: |
        The requester, approver, or a restricted platform administrator may
        close a pending or active session. Unknown and unauthorised identifiers
        share a 404 response to prevent enumeration.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Break-glass session revoked; no response body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /platform/organisations/{organisationId}/feature-flags/{key}:
    patch:
      operationId: updatePlatformCommercialFeatureFlag
      tags: [Feature Flags]
      summary: Set platform-controlled commercial activation for a tenant
      description: |
        Restricted platform administrator identity authority is required. The
        path selects the target organisation without granting access to its
        tenant data. Enabling requires a commercial activation reference. If a
        tenant flag already exists, its current version is required in
        `If-Match`; creation does not require that header.
      parameters:
        - $ref: "#/components/parameters/OrganisationIdParam"
        - $ref: "#/components/parameters/FeatureKeyParam"
        - $ref: "#/components/parameters/IfMatchVersionOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommercialFeatureFlagUpdate"
      responses:
        "200":
          description: Saved platform-controlled feature flag record
          headers:
            ETag:
              $ref: "#/components/headers/VersionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlagRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /feature-flags:
    get:
      operationId: listFeatureFlags
      tags: [Feature Flags]
      summary: List effective feature flags for the selected tenant
      description: |
        Requires `feature_flag:read`. Tenant overrides take precedence over
        global rows; commercially gated keys with no stored row are returned as
        disabled defaults. The response identifies whether each value came from
        the tenant, a global default, or the secure default.
      parameters:
        - $ref: "#/components/parameters/OrganisationContextHeader"
      responses:
        "200":
          description: Effective feature flags for the verified tenant context
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantFeatureFlag"
        "400":
          $ref: "#/components/responses/TenantSelectionRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /feature-flags/{key}:
    patch:
      operationId: updateFeatureFlag
      tags: [Feature Flags]
      summary: Update a feature flag for the selected tenant
      description: |
        Requires `feature_flag:manage`. Break-glass contexts can never mutate a
        feature flag. Enabling requires a commercial activation reference. If a
        tenant flag already exists, its version is required in `If-Match`; a new
        tenant override may be created without that header.
      parameters:
        - $ref: "#/components/parameters/FeatureKeyParam"
        - $ref: "#/components/parameters/OrganisationContextHeader"
        - $ref: "#/components/parameters/IfMatchVersionOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantFeatureFlagUpdate"
      responses:
        "200":
          description: Saved tenant feature flag
          headers:
            ETag:
              $ref: "#/components/headers/VersionETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantFeatureFlagSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /clients:
    get:
      operationId: listClients
      tags: [Clients]
      summary: List clients
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [Clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreate"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/BadRequest"
  /clients/{id}:
    get:
      operationId: getClient
      tags: [Clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateClient
      tags: [Clients]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List projects with dashboard aggregates
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSummary"
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a tender project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
  /projects/{id}:
    get:
      operationId: getProject
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
