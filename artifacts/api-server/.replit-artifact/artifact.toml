kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Run the guarded migration and API bootstrap in one Node process.
args = ["node", "--enable-source-maps", "scripts/start-replit-production.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
CORS_ALLOWED_ORIGINS = "https://valo-mvp-builder.replit.app"
VALO_PUBLIC_LEAD_DESTINATION = "database"
TRUST_PROXY = "1"

[services.production.health.startup]
path = "/api/healthz"
